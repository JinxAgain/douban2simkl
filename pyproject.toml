[project]
name = "douban2simkl"
version = "0.1.0"
description = "Sync Douban movies and TV shows watch history to Simkl"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "browser-cookie3>=0.19.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["douban-idatabase", "douban-backup", ".venv", "build", "dist"]
